version: "2"

# Exclude vendored Go stdlib crypto/tls fork and vendored pion CCM code from lint.
# These are intentionally kept close to upstream: see VENDORED.md.
run:
  build-tags: []

# Show all issues: golangci-lint defaults cap output at 50 per linter.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  settings:
    staticcheck:
      # Disable quick-fix style suggestions (QF*). These are subjective:
      # explicit forms are often clearer than the suggested transforms,
      # especially for embedded-field selectors that document intent.
      checks:
        - -QF1001  # De Morgan's law (explicit form is clearer)
        - -QF1003  # tagged switch (style preference)
        - -QF1006  # lift into loop condition (style preference)
        - -QF1008  # remove embedded field from selector (explicit is safer)
  exclusions:
    paths:
      # Anchored to the directory boundary: golangci-lint v2 matches each
      # entry as an unanchored regex against the relative path, and the
      # unanchored form also matched ccmserver.go and ccm_tls13_test.go.
      - ^pkg/sep2tls/gotls/
      - ^pkg/sep2tls/ccm/
