version: "2"

# Exclude vendored Go stdlib crypto/tls fork and vendored pion CCM code from lint.
# These are intentionally kept close to their upstream sources; each
# package's own header comment names its origin and license.
run:
  build-tags: []

# Show all issues: golangci-lint defaults cap output at 50 per linter.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  settings:
    staticcheck:
      # golangci-lint v2.12.2's built-in default staticcheck checks list is
      # "all" minus these six ST codes: confirmed empirically by running
      # `golangci-lint run --no-config --enable-only staticcheck` (built-in
      # defaults) beside an explicit `checks: [all, -ST1000, -ST1003,
      # -ST1016, -ST1020, -ST1021, -ST1022]` against the same probe file and
      # observing identical output, while `checks: [all]` alone additionally
      # reports all six.
      #
      # Disable quick-fix style suggestions (QF*) on top of that default.
      # These are subjective: explicit forms are often clearer than the
      # suggested transforms, especially for embedded-field selectors that
      # document intent.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001  # De Morgan's law (explicit form is clearer)
        - -QF1003  # tagged switch (style preference)
        - -QF1006  # lift into loop condition (style preference)
        - -QF1008  # remove embedded field from selector (explicit is safer)
  exclusions:
    paths:
      # Anchored to the directory boundary: golangci-lint v2 matches each
      # entry as an unanchored regex against the relative path, and the
      # unanchored form also matched ccmserver.go and ccm_tls13_test.go.
      - ^pkg/sep2tls/gotls/
      - ^pkg/sep2tls/ccm/
