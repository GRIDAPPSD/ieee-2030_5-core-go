name: CI

# GitHub-hosted runners are acceptable here: both jobs are read-only
# verification (build, vet, test, and a gofmt formatting check), and
# neither job deploys, pushes to a registry, or writes anywhere but
# its own ephemeral runner storage. See
# .claude/rules/devops.md "GitHub Actions" in the Knowledge workspace
# for the posture this exception follows.
#
# Unlike the sibling gridappsd-ieee-2030_5-go bridge repo, this module
# imports no other GRIDAPPSD modules (see go.mod: only
# golang.org/x/crypto and pgregory.net/rapid), so no GitHub App
# installation token is needed to resolve one. If a GRIDAPPSD module
# dependency is ever added here, port the token-minting steps from the
# bridge's ci.yml rather than reinventing them.
#
# The schema-gated tests need the IEEE 2030.5 sep.xsd, which is
# copyrighted by IEEE and is not in this repository (see NOTICE).
# First-party runs reassemble a licensed copy from two repository
# secrets into a file outside the checkout and point SEP2_SCHEMA_PATH at
# it; a run with no secrets in scope (a pull request from a fork, or any
# run GitHub withholds secrets from) skips those tests and still reports
# green.
#
# This workflow triggers on `pull_request`, deliberately NOT on
# `pull_request_target`. This module is slated to go public, and
# pull_request_target runs with repository secrets in scope against code
# the fork controls, which would hand the schema secrets to any PR
# author. Do not change that trigger.

on:
  push:
    branches: [main]
    # Doc-only changes do not affect build artifacts, so skip the full
    # build/vet/test/gofmt matrix for them.
    paths-ignore: ['**/*.md', 'docs/**', 'CHANGELOG.md']
  pull_request:
    branches: [main]
    # See the push trigger comment above; the same rationale applies.
    paths-ignore: ['**/*.md', 'docs/**', 'CHANGELOG.md']

# Least-privilege baseline: neither job writes anything (no release, no
# PR comment, no package publish), so the default token scope is
# read-only rather than inheriting the repo or org default, which can
# be write-all.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Supply the IEEE 2030.5 schema
        id: schema
        # The schema arrives as two secrets because GitHub's 65536-byte
        # secret limit applies to the sealed value, not the plaintext:
        # sealing plus base64 inflates by roughly 4/3, putting the
        # effective plaintext ceiling near 49100 bytes, and a single
        # value was rejected with HTTP 422. The two parts are halves of
        # one base64 string: concatenate with no separator, decode,
        # decompress. Do not fold them back into one secret.
        #
        # Nothing below echoes a part, the joined string, or the decoded
        # file, and printf is a shell builtin, so no part reaches a
        # process argument list either.
        env:
          SCHEMA_PART_0: ${{ secrets.SEP2_SCHEMA_XZ_B64_0 }}
          SCHEMA_PART_1: ${{ secrets.SEP2_SCHEMA_XZ_B64_1 }}
        run: |
          set -euo pipefail

          # Transport check on the reassembly only: these describe the
          # bytes sealed into the two secrets (IEEE 2030.5-2018 Model
          # Build 20180301 sep.xsd). The document's identity is pinned
          # independently and more strongly by the Go loader, over a
          # normalized sha256 (see schema/PROVENANCE.md). If the secrets
          # are ever resealed from a copy with different line endings,
          # update these two values; the Go-side digest is unaffected.
          want_md5=e4acb8b31a64a70c06af24f22f2d0441
          want_bytes=381926

          # Both parts empty is legitimate absence: GitHub withholds
          # secrets from fork pull requests, and an outside contributor's
          # run has to stay green with the gated tests skipped. Exactly
          # one part empty is not absence, it is a half-rotated or
          # half-deleted secret pair, and it fails here rather than
          # quietly degrading into the skip path.
          if [ -z "${SCHEMA_PART_0:-}" ] && [ -z "${SCHEMA_PART_1:-}" ]; then
            echo "No schema secrets in scope for this run (fork pull request, or secrets withheld)."
            echo "Leaving SEP2_SCHEMA_REQUIRED unset: the schema-gated tests SKIP and the run stays green."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${SCHEMA_PART_0:-}" ] || [ -z "${SCHEMA_PART_1:-}" ]; then
            echo "::error::Exactly one of SEP2_SCHEMA_XZ_B64_0 and SEP2_SCHEMA_XZ_B64_1 is set. That is a broken secret pair, not an absent schema; set both or neither."
            exit 1
          fi

          if ! command -v xz > /dev/null; then
            echo "::error::xz is not installed on this runner, so the schema cannot be decompressed."
            exit 1
          fi

          # Written outside the checkout on purpose. RUNNER_TEMP is not
          # the repo working tree, so the file cannot be committed, is
          # not visible to anything that globs the tree, and is not part
          # of any path a later step would upload as an artifact. The
          # runner deletes it when the job ends.
          dest_dir="${RUNNER_TEMP:?RUNNER_TEMP is unset}/sep2-schema"
          case "$dest_dir" in
            "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is unset}"/*)
              echo "::error::Refusing to write the schema inside the repository working tree."
              exit 1
              ;;
          esac
          umask 077
          mkdir -p "$dest_dir"
          dest="$dest_dir/sep.xsd"

          if ! printf '%s%s' "$SCHEMA_PART_0" "$SCHEMA_PART_1" \
            | tr -d '[:space:]' \
            | base64 -d \
            | xz -d > "$dest"; then
            rm -f "$dest"
            echo "::error::Could not reassemble sep.xsd from SEP2_SCHEMA_XZ_B64_0 and SEP2_SCHEMA_XZ_B64_1. The two parts must concatenate, with no separator, into one base64 string holding an xz stream."
            exit 1
          fi

          got_bytes=$(wc -c < "$dest")
          got_md5=$(md5sum < "$dest" | cut -d ' ' -f 1)
          if [ "$got_bytes" != "$want_bytes" ] || [ "$got_md5" != "$want_md5" ]; then
            rm -f "$dest"
            echo "::error::Reassembled schema is not the expected document: $got_bytes bytes, md5 $got_md5; want $want_bytes bytes, md5 $want_md5. A truncated or half-rotated secret part is the likely cause; reseal both parts from one copy."
            exit 1
          fi
          echo "Reassembled sep.xsd: $got_bytes bytes, md5 matches."

          # Only reached once the file on disk is verified, so no path
          # gets to go test with a schema configured but unchecked, and
          # none gets there with the secrets present but REQUIRED unset.
          {
            echo "SEP2_SCHEMA_PATH=$dest"
            echo "SEP2_SCHEMA_REQUIRED=1"
          } >> "$GITHUB_ENV"
          echo "armed=true" >> "$GITHUB_OUTPUT"

      - name: Confirm the schema gate is armed
        if: steps.schema.outputs.armed == 'true'
        # SEP2_SCHEMA_REQUIRED=1 already turns an absent or unreadable
        # schema into a failure. This adds the positive assertion:
        # TestSchemaGateArmed has to PASS, not SKIP and not vanish into
        # "no tests to run", so a green run cannot mean a suite that
        # checked nothing against the standard.
        run: |
          set -euo pipefail
          output=$(go test -run '^TestSchemaGateArmed$' -v ./internal/xsdgate/)
          echo "$output"
          case "$output" in
            *"--- PASS: TestSchemaGateArmed"*)
              ;;
            *)
              echo "::error::A schema was supplied but TestSchemaGateArmed did not pass, so the wire-format gate validated nothing."
              exit 1
              ;;
          esac

      - name: Test (race)
        # SEP2_SCHEMA_PATH and SEP2_SCHEMA_REQUIRED reach this step
        # through GITHUB_ENV from the schema step above, when and only
        # when the secrets were in scope.
        run: go test -race ./...

  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          # pkg/sep2tls/gotls/stubs/cpu/cpu.go is a vendored stub ported
          # from the Go standard library's internal/cpu (see the
          # package's own header comment) for the crypto/tls fork under
          # pkg/sep2tls/gotls. It is deliberately kept close to its
          # upstream source rather than reformatted, and gofmt -l flags
          # one struct-field alignment difference in it. This exclusion
          # is scoped to that single file, not to the stubs/ directory
          # or the gotls/ tree as a whole: the other three stub files
          # (boring, fipstls, godebug) pass gofmt cleanly today and stay
          # covered by this check. If a future vendor drop adds another
          # pre-formatted file that needs the same treatment, add it
          # here explicitly rather than widening the pattern to a
          # directory glob.
          unformatted=$(gofmt -l . | grep -v '^pkg/sep2tls/gotls/stubs/cpu/cpu\.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt check passed (excluding the vendored stub noted above)."
